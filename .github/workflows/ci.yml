name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test dependencies
        run: python -m pip install --disable-pip-version-check numpy

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Python syntax
        run: python -m py_compile __init__.py nodes.py mask_core.py palette_core.py color_range_core.py qwen_material_region_core.py qwen_material_plan_core.py

      - name: JavaScript syntax
        run: |
          node --check web/id_color_picker.js
          node --check web/id_palette_system.js
          node --check web/color_range_picker.js
